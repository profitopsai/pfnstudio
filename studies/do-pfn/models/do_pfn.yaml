id: do_pfn
name: Do-PFN - checkpoint-compatible axial transformer (Robertson et al., 2025)
version: 0.1.0
description: >-
  PFN Studio reproduction of the released Do-PFN architecture. The custom
  input encoder separately embeds grouped X features and the masked Y target;
  12 custom post-norm axial layers perform full multi-head feature attention
  and context-only row attention; the Y token is decoded by a full-support
  100-bucket bar-distribution head.
narrative: |-
  Given observational context and intervention queries, this model predicts
  the conditional interventional outcome distribution.

  1. The Do-PFN input encoder context-normalizes and clips X, groups X using
     the released checkpoint setting, and appends Y as a separate masked token.
  2. Twelve Do-PFN axial layers attend across feature tokens and then across
     rows, with query rows restricted to context keys and values.
  3. The Y-token readout selects the outcome representation.
  4. The full-support bar head predicts 100 outcome-density buckets; its mean
     is used as the point estimate.
input_shape: (B, N, d+2)
blocks:
  - type: separate_xy_input_encoder
    name: input_encoder
    config:
      d_model: 192
      num_cols: 8
      features_per_group: 85
      normalize_by_used_features: true
      clip_value: 100.0
      eps: 1.0e-6
      bias: true
      seed: 42
      log_first_n: 3
  - type: context_query_axial_attention
    name: axial_layer_01
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_02
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_03
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_04
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_05
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_06
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_07
    config:
      d_model: 192
      n_heads: 6
      ff_mult: 4
      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: context_query_axial_attention
    name: axial_layer_08
