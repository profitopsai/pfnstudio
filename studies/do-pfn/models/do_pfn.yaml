      layer_norm_eps: 1.0e-5
      log_first_n: 1
  - type: row_pool_for_head
    name: y_token
    config:
      target_col: 1
  - type: bar_distribution_head
    name: interventional_distribution
    config:
      d_model: 192
      hidden_dim: 768
      num_buckets: 100
      setup_tasks: 100
      setup_points: 256
      setup_seed: 987654
      tail_mass_within_edge: 0.5
      min_bucket_width: 1.0e-6
      seed: 42
      log_first_n: 3
output_heads:
  - name: interventional_distribution
    task: custom
citations:
